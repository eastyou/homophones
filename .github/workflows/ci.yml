name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装项目
        run: python -m pip install -e .

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 生成示例页面
        run: |
          python -m homophones quiz --count 10 --seed 5 -o examples/quiz.html
          python -m homophones match --count 8 --seed 3 -o examples/match.html
          python -m homophones groups -o examples/groups.html

      - name: 检查命令行入口
        run: homophones --help
